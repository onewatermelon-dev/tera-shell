name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议。描述清楚使用场景和动机，比描述实现方式更有帮助。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么不方便的地方？现在是怎么绕过去的？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望这个功能大致怎么工作？可以配示意图或代码片段
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 有没有试过其他解决办法？为什么不太行
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 使用场景
      description: 在什么服务器、什么工作流下会用到这个功能
    validations:
      required: false