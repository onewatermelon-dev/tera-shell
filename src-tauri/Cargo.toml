[package]
name = "tera-shell"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# 在 https://doc.rust-lang.org/cargo/reference/manifest.html 查看更多键及其定义

[lib]
# `_lib` 后缀看似多余，但却是必要的
# 使 lib 名称唯一并且不会与 bin 名称冲突。
# 这似乎只是 Windows 上的问题，请参阅 https://github.com/rust-lang/cargo/issues/8519
name = "tera_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri 核心 ──
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# 使用操作系统默认浏览器打开经过 capability 授权的 HTTP/HTTPS 链接。
tauri-plugin-opener = "2"

# ── SSH ──
russh = "0.49"
russh-keys = "0.49"

# ── SFTP ──
ssh2 = "0.9"

# ── 本地 PTY ──
portable-pty = "0.8"

# ── 异步运行时 ──
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 数据库 ──
rusqlite = { version = "0.31", features = ["bundled"] }

# ── 加密 ──
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# ── 编码转换 ──
encoding_rs = "0.8"

# ── 工具库 ──
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = "0.4"
parking_lot = "0.12"
bytes = "1"
