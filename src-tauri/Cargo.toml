[package]
name = "tera-shell"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# 在 https://doc.rust-lang.org/cargo/reference/manifest.html 查看更多键及其定义

[lib]
# `_lib` 后缀看似多余，但却是必要的
# 使 lib 名称唯一并且不会与 bin 名称冲突。
# 这似乎只是 Windows 上的问题，请参阅 https://github.com/rust-lang/cargo/issues/8519
name = "tera_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri 核心 ──
# ⚠️ tauri 与 tauri-plugin-notification 都**精确钉死**版本，勿随手改成 "2"。
#
# 原因：notification 插件 ≥2.7 硬要求 tauri 2.12+，而 tauri 2.12 会把
# tao 抬到 0.37、windows-core 抬到 0.62 —— 项目里 `lib.rs` 禁用浏览器
# 快捷键那段 WebView2 代码（`settings.cast::<ICoreWebView2Settings3>()`）
# 直接编译失败。钉在 2.11 就不会有这个连锁升级。
# 将来要整体升级时，四个包（tauri / tauri-runtime / tauri-runtime-wry /
# tao）必须**一起**放到新的大版本，只动其一会出 trait 不匹配 +
# 两套 webview2-com-sys 互相类型不兼容。
tauri = { version = "=2.11.5", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# 使用操作系统默认浏览器打开经过 capability 授权的 HTTP/HTTPS 链接。
tauri-plugin-opener = "2"
# 长命令 / AI 完成 / 传输结束的系统通知。⚠️ Web Notification API 走不通：
# WebView2 的 AreHostNotificationsAllowed 默认关闭，且 wry/Tauri 未暴露
# 该开关，只能由这个原生插件托底。版本需与上面的 tauri 2.11 匹配。
tauri-plugin-notification = "=2.4.0"

# ── SSH ──
russh = "0.49"
russh-keys = "0.49"

# ── SFTP ──
ssh2 = "0.9"

# ── 本地 PTY ──
portable-pty = "0.8"

# ── HTTP 出口（模型连通性测试 + AI 聊天流式；已在依赖树里，直用不新增下载）──
reqwest = { version = "0.13", features = ["json", "stream", "socks"] }

# ── 异步运行时 ──
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# ── 序列化 ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 数据库 ──
rusqlite = { version = "0.31", features = ["bundled"] }

# ── 加密 ──
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# ── 编码转换 ──
encoding_rs = "0.8"
# 把取到的图标位图编码成 PNG（必须带 alpha，BMP 的 32bpp 不解释 alpha 会出黑框）
image = { version = "0.25", default-features = false, features = ["png"] }

# ── 工具库 ──
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
parking_lot = "0.12"
bytes = "1"

# ── Windows 专用：WebView2 COM（禁用浏览器级快捷键，避免 Ctrl+F 弹出页面查找栏）──
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# DPAPI：用当前 Windows 用户凭据加密保存 SSH 密码（CryptProtectData）
windows = { version = "0.61", features = [
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_Foundation",
    # 文件列表用系统原生图标：SHGetFileInfo 取图标 + DrawIconEx 画到 DIB
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    # CoTaskMemFree：释放 SHGetSpecialFolderLocation 返回的 PIDL
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging"
] }
